name: Native editorial English review
on:
  push:
    branches: [feat/bilingual-campus-handoff]
    paths: [campus/tools/translate_editorial_native.py, .github/workflows/editorial-native.yml]
permissions:
  contents: read
jobs:
  translate:
    if: github.ref == 'refs/heads/feat/bilingual-campus-handoff'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editorial-only native translator
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 sentencepiece==0.2.1 sacremoses==0.1.1
      - name: Translate public source prose with native tokenizers
        run: python campus/tools/translate_editorial_native.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-english-${{ matrix.shard }}
          path: /tmp/editorial-native/*.json
          retention-days: 7
          if-no-files-found: error
