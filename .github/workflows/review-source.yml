name: Public source review snapshot
on:
  push:
    branches: [maintenance/rutas-dpd-integracion-20260918]
    paths: [.github/workflows/review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle tracked objects only, never runner configuration or credentials
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/review.bundle" --all
          cd "$RUNNER_TEMP"
          sha256sum review.bundle > review.bundle.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-review
          path: |
            ${{ runner.temp }}/review.bundle
            ${{ runner.temp }}/review.bundle.sha256
          retention-days: 1
          if-no-files-found: error
