name: Campus - build and acceptance
on:
  push:
    branches: ['main', 'feat/campus-web-v2']
    paths: ['campus/**', 'formacion/sistemas-operativos/**', '.github/workflows/campus.yml', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['campus/**', 'formacion/sistemas-operativos/**', '.github/workflows/campus.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare reports
        run: mkdir -p campus/qa
      - name: Compiler unit tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s campus/tests -p 'test_*.py' -v 2>&1 | tee campus/qa/compiler.log
      - name: Progress state tests
        shell: bash
        run: |
          set -o pipefail
          node --test campus/tests/state.test.mjs 2>&1 | tee campus/qa/state.log
          node --check campus/assets/app.js
      - name: Compile real course
        shell: bash
        run: |
          set -o pipefail
          python3 campus/build.py | tee campus/qa/build.json
      - name: Install browser test dependency
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Browser acceptance
        shell: bash
        run: |
          set -o pipefail
          python3 campus/tests/browser.py 2>&1 | tee campus/qa/browser.log
      - name: Existing kit tests
        working-directory: formacion/sistemas-operativos/kit
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Existing planning tests
        working-directory: formacion/sistemas-operativos/planificacion
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Verified site, reports and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-web-v2
          path: |
            campus/
            formacion/sistemas-operativos/
            README.md
            .github/workflows/campus.yml
            !**/__pycache__/**
            !**/*.pyc
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
