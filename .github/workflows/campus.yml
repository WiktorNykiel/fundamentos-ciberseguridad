name: Campus - build and acceptance
on:
  push:
    branches: ['feat/campus-web-v2']
    paths: ['campus/**', 'formacion/sistemas-operativos/**', '.github/workflows/campus.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve course source snapshot for reproducible review
        uses: actions/upload-artifact@v4
        with:
          name: campus-course-sources
          path: |
            formacion/sistemas-operativos/
            README.md
          retention-days: 2
      - name: Existing kit tests
        working-directory: formacion/sistemas-operativos/kit
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Existing planning tests
        working-directory: formacion/sistemas-operativos/planificacion
        run: python3 -m unittest discover -p 'test_*.py' -v
