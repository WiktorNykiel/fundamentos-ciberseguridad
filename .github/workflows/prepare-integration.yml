name: Pinned integration candidate
on:
  push:
    branches: [maintenance/review-integration-20260915]
    paths: ['maintenance/prepare_integration.py', '.github/workflows/prepare-integration.yml', 'tests/dependencies.test.cjs']
permissions:
  contents: read
concurrency:
  group: pinned-integration-review
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare reviewed sources and pinned PR changes
        run: python3 maintenance/prepare_integration.py
      - name: Record review discussions and stop on requested changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for pr in 1 4 5 6 10 11 12 13 14 15 16; do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews" > "review-output/pr-${pr}-reviews.json"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/comments" > "review-output/pr-${pr}-comments.json"
            jq -e 'all(.[]; .state != "CHANGES_REQUESTED")' "review-output/pr-${pr}-reviews.json" >/dev/null
          done
      - name: Align lockfile using registry with lifecycle scripts disabled
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reproducible dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint, types and bounded dependency checks
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee review-output/lint.log
          npm run typecheck 2>&1 | tee review-output/types.log
          npm run test:dependencies 2>&1 | tee review-output/dependencies.log
      - name: Production build and audit
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee review-output/next-build.log
          npm audit --omit=dev --audit-level=high --json | tee review-output/npm-audit.json
      - name: Campus unit tests and real-course compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s campus/tests -p 'test_*.py' -v 2>&1 | tee review-output/compiler.log
          node --test campus/tests/state.test.mjs 2>&1 | tee review-output/state.log
          node --check campus/assets/app.js
          python3 campus/build.py | tee review-output/campus-build.json
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Browser and existing-course regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 campus/tests/browser.py 2>&1 | tee review-output/browser.log
          (cd formacion/sistemas-operativos/kit && python3 -m unittest discover -p 'test_*.py' -v) 2>&1 | tee review-output/kit.log
          (cd formacion/sistemas-operativos/planificacion && python3 -m unittest discover -p 'test_*.py' -v) 2>&1 | tee review-output/planning.log
      - name: Package only validated candidate changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary HEAD -- package.json package-lock.json campus src .github/workflows/campus.yml > review-output/candidate.patch
          git diff --name-only HEAD > review-output/changed-files.txt
          sha256sum review-output/candidate.patch > review-output/candidate.sha256
          cp campus/pages-ready.zip review-output/pages-ready.zip
          mkdir -p review-output/screenshots
          cp campus/qa/screenshots/*.png review-output/screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-integration-candidate
          path: review-output/
          retention-days: 7
          if-no-files-found: error
  publish-review-branch:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/review-integration-20260915
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-integration-candidate
          path: review-output
      - name: Commit tested tree with reviewed PR ancestry, review branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'WiktorNykiel/fundamentos-ciberseguridad'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check review-output/candidate.sha256
          git apply --check review-output/candidate.patch
          git apply review-output/candidate.patch
          python3 - <<'PY'
          import subprocess
          allowed={'package.json','package-lock.json','campus/assets/state.js','campus/assets/app.js','campus/tests/state.test.mjs','campus/tests/browser.py','campus/package.json','campus/build.py','campus/README.md','src/app/layout.tsx','src/app/globals.css','.github/workflows/campus.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if not changed <= allowed:raise SystemExit('Unexpected candidate path; stop')
          PY
          git add package.json package-lock.json campus src .github/workflows/campus.yml
          git config user.name 'Wiktor Nykiel'
          git config user.email 'WiktorNykiel@users.noreply.github.com'
          parents=(-p "$GITHUB_SHA")
          while IFS= read -r sha; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "$sha"
            parents+=(-p "$sha")
          done < review-output/parents.txt
          commit=$(git commit-tree "$(git write-tree)" "${parents[@]}" -m 'fix: integrate 11 reviewed dependency PRs and campus progress regressions')
          git push origin "$commit:refs/heads/maintenance/review-integration-20260915"
          echo "Candidate commit: $commit" >> "$GITHUB_STEP_SUMMARY"
