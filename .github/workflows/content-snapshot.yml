name: Content review source snapshot
on:
  push:
    branches: [docs/content-review-20260920]
    paths: [.github/workflows/content-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked sources without execution
        run: |
          git archive --format=zip HEAD -o review-source.zip
          git rev-parse HEAD > review-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: content-review-source
          path: |
            review-source.zip
            review-source-commit.txt
          retention-days: 7
